name: Android CI

on:
  push:
    branches: [ "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Unit tests and debug build
        run: gradle testDebugUnitTest assembleDebug lintDebug --stacktrace
      - name: Summarize unit and lint results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          suites = [ET.parse(p).getroot() for p in files]
          for suite in suites:
              for case in suite.iter():
                  if case.tag.rsplit("}", 1)[-1] != "testcase":
                      continue
                  for failure in list(case):
                      if failure.tag.rsplit("}", 1)[-1] in ("failure", "error"):
                          detail = failure.get("message") or failure.text or ""
                          print("Failed test:", case.get("classname"), case.get("name"), detail[:1000])
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          print("Unit test totals:", totals)
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          lint = ET.parse("app/build/reports/lint-results-debug.xml").getroot()
          counts = {s: sum(i.get("severity") == s for i in lint) for s in ("Fatal", "Error", "Warning")}
          print("Lint totals:", counts)
          assert counts["Fatal"] == counts["Error"] == 0
          PY
      - name: Upload unit and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cad-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  remote-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Remote navigation and human takeover
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle connectedDebugAndroidTest --stacktrace
      - name: Summarize emulator results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          suites = [ET.parse(p).getroot() for p in files]
          for suite in suites:
              for case in suite.iter():
                  if case.tag.rsplit("}", 1)[-1] != "testcase":
                      continue
                  for failure in list(case):
                      if failure.tag.rsplit("}", 1)[-1] in ("failure", "error"):
                          detail = failure.get("message") or failure.text or ""
                          print("Failed test:", case.get("classname"), case.get("name"), detail[:1000])
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          print("Emulator test totals:", totals)
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          PY
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
